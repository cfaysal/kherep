<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" role="img" aria-labelledby="t d">
  <title id="t">Kherep Brain</title>
  <desc id="d">How Kherep sessions read from and write to one shared Confluence knowledge space: lifecycle hooks, the observation agent, the broker and the space structure.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C98F51"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ECD2A3"/>
    </marker>
    <marker id="arrh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FFECC4"/>
    </marker>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#FFECC4" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ECD2A3" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#C98F51" stop-opacity="0"/>
    </radialGradient>
    <!-- Invisible journeys the animated packets follow -->
    <path id="journey-write" d="M280 211 V763 H548 V230 H800 V705 H1040 V340 H1320 V600"/>
    <path id="journey-read" d="M520 470 H562 V110 H1066 V200 H1090 V244 H1052 V122 H574 V505 H522"/>
  </defs>
  <style>
    .bg { fill: #181818; }
    .frame { fill: none; stroke: #604830; stroke-width: 2; }
    .box { fill: #241c16; stroke: #966136; stroke-width: 1.5; }
    .box-hi { fill: #2b2016; stroke: #C98F51; stroke-width: 2; }
    .box-warn { fill: #301818; stroke: #966136; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .title { font: 600 40px Georgia, 'Times New Roman', serif; fill: #FFECC4; letter-spacing: 10px; }
    .sub { font: 400 18px 'Segoe UI', Inter, Arial, sans-serif; fill: #ECD2A3; }
    .col { font: 600 15px 'Segoe UI', Inter, Arial, sans-serif; fill: #C98F51; letter-spacing: 3px; }
    .h { font: 600 17px 'Segoe UI', Inter, Arial, sans-serif; fill: #FFECC4; }
    .b { font: 400 14px 'Segoe UI', Inter, Arial, sans-serif; fill: #E8E8E8; }
    .m { font: 400 13px Consolas, 'Cascadia Mono', monospace; fill: #ECD2A3; }
    .n { font: 700 15px Georgia, serif; fill: #181818; }
    .lbl { font: 400 12px 'Segoe UI', Inter, Arial, sans-serif; fill: #C98F51; font-style: italic; }
    .chip { fill: #181818; stroke: #604830; stroke-width: 1; }
    .flow { stroke: #C98F51; stroke-width: 2; fill: none; }
    .hits { stroke: #FFECC4; stroke-width: 2.5; fill: none; }
    .read { stroke: #ECD2A3; stroke-width: 2; fill: none; stroke-dasharray: 7 5; animation: march 1.2s linear infinite; }
    @keyframes march { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) {
      .pkt { display: none; }
      .hits { stroke: #FFECC4; stroke-width: 2.5; fill: none; }
    .read { animation: none; }
    }
  </style>

  <rect class="bg" width="1600" height="1080"/>
  <rect class="frame" x="12" y="12" width="1576" height="1056" rx="6"/>

  <text class="title" x="40" y="66">KHEREP BRAIN</text>
  <text class="sub" x="40" y="96">One shared Confluence space. Searched before an answer, written after a turn, by every runtime on every host.</text>

  <!-- ===== Column A: session lifecycle ===== -->
  <text class="col" x="40" y="140">SESSION LIFECYCLE</text>

  <rect class="box" x="40" y="152" width="480" height="118" rx="6"/>
  <circle cx="64" cy="178" r="13" fill="#C98F51"/><text class="n" x="59" y="183">1</text>
  <text class="h" x="86" y="184">SessionStart · orphan check</text>
  <text class="b" x="60" y="212">Counts pages that nothing links to. Read-only: it never</text>
  <text class="b" x="60" y="232">writes. Refreshes in the background when the last report</text>
  <text class="b" x="60" y="252">is older than 24 h. A failed count is shown as unknown.</text>

  <rect class="box" x="40" y="290" width="480" height="118" rx="6"/>
  <circle cx="64" cy="316" r="13" fill="#C98F51"/><text class="n" x="59" y="321">2</text>
  <text class="h" x="86" y="322">UserPromptSubmit · research-first</text>
  <text class="b" x="60" y="350">Reminds the Maestro: search the Brain before answering a</text>
  <text class="b" x="60" y="370">relevant prompt, and query the code graph inside a repo.</text>
  <text class="b" x="60" y="390">The broker command is resolved on the host, not by the model.</text>

  <rect class="box-hi" x="40" y="428" width="480" height="118" rx="6"/>
  <circle cx="64" cy="454" r="13" fill="#ECD2A3"/><text class="n" x="59" y="459">3</text>
  <text class="h" x="86" y="460">Turn · the Maestro researches</text>
  <text class="m" x="60" y="484">search --space &lt;key&gt; --query "&lt;terms&gt;"</text>
  <text class="b" x="60" y="504">Hits come back into the session: id, title, evidence, link.</text>
  <text class="b" x="60" y="522">exit 0 hits · 1 no match · 2 could not run = UNKNOWN</text>
  <text class="b" x="60" y="540">The answer names any Brain page it contradicts.</text>

  <rect class="box" x="40" y="566" width="480" height="118" rx="6"/>
  <circle cx="64" cy="592" r="13" fill="#C98F51"/><text class="n" x="59" y="597">4</text>
  <text class="h" x="86" y="598">Stop · research-stop</text>
  <text class="b" x="60" y="626">Hands a substantial turn back once if it made no Brain</text>
  <text class="b" x="60" y="646">lookup, or no code-graph call after editing a repository.</text>
  <text class="m" x="60" y="670">opt-out: [research: none - &lt;reason&gt;]</text>

  <rect class="box" x="40" y="704" width="480" height="118" rx="6"/>
  <circle cx="64" cy="730" r="13" fill="#C98F51"/><text class="n" x="59" y="735">5</text>
  <text class="h" x="86" y="736">Stop · observation-stop</text>
  <text class="b" x="60" y="764">Hands the turn back once until the observation agent is</text>
  <text class="b" x="60" y="784">dispatched. A dispatch guard enforces its pinned model.</text>
  <text class="m" x="60" y="808">opt-out: [obs: none – &lt;reason&gt;]</text>

  <path class="flow" d="M280 270 V288" marker-end="url(#arr)"/>
  <path class="flow" d="M280 408 V426" marker-end="url(#arr)"/>
  <path class="flow" d="M280 546 V564" marker-end="url(#arr)"/>
  <path class="flow" d="M280 684 V702" marker-end="url(#arr)"/>

  <!-- ===== Column B: observation agent ===== -->
  <text class="col" x="580" y="140">OBSERVATION AGENT</text>

  <rect class="box-hi" x="580" y="152" width="440" height="156" rx="6"/>
  <text class="h" x="600" y="182">Brief from the Maestro</text>
  <text class="b" x="600" y="208">Findings of this turn only, each one marked:</text>
  <text class="m" x="600" y="232">measured:</text><text class="b" x="690" y="232">command + deciding output → confirmed</text>
  <text class="m" x="600" y="254">relayed:</text><text class="b" x="690" y="254">source named → assumed</text>
  <text class="b" x="600" y="280">No secrets, client names, hosts, private file</text>
  <text class="b" x="600" y="298">content or raw transcript.</text>

  <path class="flow" d="M520 763 H548 V230 H578" marker-end="url(#arr)"/>
  <text class="lbl" x="526" y="500" transform="rotate(-90 540 500)">dispatch</text>

  <rect class="box" x="580" y="328" width="440" height="78" rx="6"/>
  <text class="h" x="600" y="356">a  related: find neighbours first</text>
  <text class="b" x="600" y="382">Semantic proposals, kept only if they are leaf pages</text>
  <text class="b" x="600" y="399">of this space sharing a rare word with the new title.</text>

  <rect class="box" x="580" y="420" width="440" height="78" rx="6"/>
  <text class="h" x="600" y="448">b  create: page and labels in one call</text>
  <text class="b" x="600" y="474">Parent is the mapped hierarchy node, never a guess.</text>
  <text class="b" x="600" y="491">Links only to pages the search actually returned.</text>

  <rect class="box" x="580" y="512" width="440" height="58" rx="6"/>
  <text class="h" x="600" y="540">c  read back: author must be the service account</text>

  <rect class="box" x="580" y="584" width="440" height="78" rx="6"/>
  <text class="h" x="600" y="612">d  stitch: link the new page from its neighbours</text>
  <text class="b" x="600" y="638">Adds it to a merged "Related pages" block on the</text>
  <text class="b" x="600" y="655">neighbour, so nothing new is left unlinked.</text>

  <rect class="box-hi" x="580" y="676" width="440" height="58" rx="6"/>
  <text class="m" x="600" y="702">OBS-RESULT: wrote &lt;n&gt; &lt;ids&gt; | empty | failed</text>
  <text class="b" x="600" y="722">An empty result is valid; failed is reported, never hidden.</text>

  <path class="flow" d="M800 308 V326" marker-end="url(#arr)"/>
  <path class="flow" d="M800 406 V418" marker-end="url(#arr)"/>
  <path class="flow" d="M800 498 V510" marker-end="url(#arr)"/>
  <path class="flow" d="M800 570 V582" marker-end="url(#arr)"/>
  <path class="flow" d="M800 662 V674" marker-end="url(#arr)"/>

  <rect class="box-warn" x="580" y="754" width="440" height="68" rx="6"/>
  <text class="h" x="600" y="780">Codex</text>
  <text class="b" x="660" y="780">The observation agent is read-only and</text>
  <text class="b" x="600" y="802">returns drafts; the Maestro publishes them itself.</text>

  <!-- ===== Column C: broker + space ===== -->
  <text class="col" x="1080" y="140">CONFLUENCE BROKER</text>
  <rect class="box-hi" x="1080" y="152" width="480" height="232" rx="6"/>
  <text class="h" x="1100" y="180">Read · search</text>
  <text class="b" x="1100" y="204">1  Rovo semantic search ranks page titles for the query</text>
  <text class="b" x="1100" y="224">2  kept only if a leaf page of this space; top 3</text>
  <text class="b" x="1100" y="244">3  each hit carries its evidence label and link</text>
  <text class="h" x="1100" y="276">Write · create, labels, stitch</text>
  <text class="b" x="1100" y="300">One service account per runtime, each with its own</text>
  <text class="b" x="1100" y="320">credential. Computes the runtime-host label itself.</text>
  <text class="b" x="1100" y="340">Refuses a body that links to a page outside the space.</text>
  <text class="m" x="1100" y="368">search · related · get · create · labels · stitch · …</text>

  <path class="read" d="M520 470 H562 V110 H1066 V200 H1078" marker-end="url(#arrg)"/>
  <text class="lbl" x="1100" y="106">query</text>
  <path class="hits" d="M1078 244 H1052 V122 H574 V505 H522" marker-end="url(#arrh)"/>
  <text class="lbl" x="800" y="140">hits → session context</text>
  <path class="flow" d="M1020 540 H1040 V340 H1078" marker-end="url(#arr)"/>
  <text class="lbl" x="1024" y="560">write</text>

  <text class="col" x="1080" y="404">KNOWLEDGE SPACE</text>
  <rect class="box" x="1080" y="416" width="480" height="406" rx="6"/>
  <path class="flow" d="M1320 384 V414" marker-end="url(#arr)"/>

  <text class="h" x="1100" y="446">Shallow hierarchy: what a page is about</text>
  <g class="m">
    <text x="1112" y="474">Development / General</text>
    <text x="1112" y="496">Development / Forge Apps / &lt;App&gt;</text>
    <text x="1112" y="518">Development / DC Apps / &lt;App&gt;</text>
    <text x="1112" y="540">Atlassian</text>
    <text x="1112" y="562">Operations</text>
    <text x="1112" y="584">Kherep</text>
  </g>

  <text class="h" x="1100" y="622">Everything else is a label</text>
  <rect class="chip" x="1100" y="634" width="140" height="26" rx="13"/><text class="m" x="1112" y="652">type-observation</text>
  <rect class="chip" x="1248" y="634" width="292" height="26" rx="13"/><text class="m" x="1260" y="652">evidence-confirmed|assumed|refuted|…</text>
  <rect class="chip" x="1100" y="666" width="296" height="26" rx="13"/><text class="m" x="1112" y="684">status-author-model|verified|operator</text>
  <rect class="chip" x="1404" y="666" width="116" height="26" rx="13"/><text class="m" x="1416" y="684">session-&lt;id&gt;</text>
  <rect class="chip" x="1100" y="698" width="204" height="26" rx="13"/><text class="m" x="1112" y="716">runtime-&lt;runtime&gt;-&lt;host&gt;</text>
  <rect class="chip" x="1312" y="698" width="228" height="26" rx="13"/><text class="m" x="1324" y="716">product-jira|confluence|jsm</text>

  <text class="b" x="1100" y="760">One page per finding. A contradiction becomes a new</text>
  <text class="b" x="1100" y="780">page that names the one it contradicts; the agent never</text>
  <text class="b" x="1100" y="800">marks existing knowledge as superseded on its own.</text>

  <!-- ===== Privacy band ===== -->
  <rect class="box-warn" x="40" y="858" width="1520" height="132" rx="6"/>
  <text class="col" x="64" y="890">PRIVACY BOUNDARY</text>
  <text class="b" x="64" y="922">Private inputs (secrets, client data, private files) never cross an agent boundary: a dispatch guard denies any privacy-tagged input before the call.</text>
  <text class="b" x="64" y="946">They go only to the local inference runner on the same host, which hands back a status and an opaque receipt, never the content. There is no cloud fallback.</text>
  <text class="b" x="64" y="970">Search terms follow the same classification, so private content never reaches the knowledge space.</text>

  <text class="lbl" x="40" y="1030">Source: github.com/cfaysal/kherep · hooks under claude/hooks, broker under modules/atl-jira-brokers · state of 8 October 2026</text>

  <!-- ===== Animated packets (hidden with reduced motion) ===== -->
  <g class="pkt">
    <circle r="11" fill="url(#glow)">
      <animateMotion dur="14s" repeatCount="indefinite" rotate="0" calcMode="linear"><mpath href="#journey-write"/></animateMotion>
    </circle>
    <circle r="9" fill="url(#glow)">
      <animateMotion dur="5s" begin="1s" repeatCount="indefinite"><mpath href="#journey-read"/></animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
